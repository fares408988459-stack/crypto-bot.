name: Crypto Analysis Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # ربط المهمة تماماً بالبيئة التي أنشأتها لكي يقرأ السر منها بنجاح
    environment: 
      name: مفتاح واجهة برمجة تطبيقات GEMINI / التكوين البيئات
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests tradingview-ta

      - name: Run Trading Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py
